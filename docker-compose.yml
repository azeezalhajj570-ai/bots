services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-group-manager-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # expect DATABASE_URL to be provided via .env or external environment
      # e.g. postgresql://user:pass@host:5432/dbname
      DATABASE_URL: ${DATABASE_URL}
      DB_PATH: /app/data/bot.db
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "bot.py"]
