services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-group-manager-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "bot.py"]
